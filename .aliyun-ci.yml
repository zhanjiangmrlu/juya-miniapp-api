name: juya-miniapp-api-test

# Configure BOTH code sources in Flow: miniapp-api/test and admin-api/test.
# Working directory: miniapp-api repository root. Admin default path: ../juya-admin-api.
# Validation task: Docker Daemon OFF. Image build task: Docker Daemon ON.
# Bind GitHub service connection, artifact store and TEST-only machine group in console.
stages:
  verify_stage:
    name: 隔离测试
    jobs:
      verify_job:
        name: 原生 MySQL Redis 验证
        runsOn: public/cn-hangzhou
        steps:
          verify_step:
            step: Command
            with:
              run: |
                set -eu
                test "${CI_COMMIT_REF_NAME}" = test
                sh deploy/ci-verify.sh

  build_stage:
    name: 构建镜像制品
    jobs:
      build_job:
        name: Docker 构建与制品上传
        runsOn: public/cn-hangzhou
        steps:
          build_step:
            step: Command
            with:
              run: |
                set -eu
                test "${CI_COMMIT_REF_NAME}" = test
                sh deploy/build-artifact.sh "${CI_COMMIT_REF_NAME}" "${CI_COMMIT_SHA}" artifact
          upload_step:
            step: ArtifactUpload
            with:
              uploadType: flowPublic
              artifact: juya_miniapp_api_test
              filePath:
                - artifact/

  deploy_stage:
    name: 发布测试 ECS
    jobs:
      deploy_job:
        name: 发布小程序后端
        component: VMDeploy
        with:
          artifact: $[stages.build_stage.build_job.upload_step.artifacts.juya_miniapp_api_test]
          machineGroup: ${ECS_TEST_MACHINE_GROUP_ID}
          artifactDownloadPath: /home/admin/app/juya-miniapp-api-test.tgz
          executeUser: root
          run: |
            set -eu
            test "${CI_COMMIT_REF_NAME}" = test
            staging="$(mktemp -d /tmp/juya-miniapp-api-test.XXXXXX)"
            trap 'rm -rf "$staging"' EXIT
            tar xzf /home/admin/app/juya-miniapp-api-test.tgz -C "$staging"
            bundle="$staging/artifact"
            if [ ! -d "$bundle" ]; then bundle="$staging"; fi
            sh "$bundle/deploy/ecs-artifact-deploy.sh" "${CI_COMMIT_REF_NAME}" "$bundle"
