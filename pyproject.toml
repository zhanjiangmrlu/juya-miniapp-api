[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "juya-miniapp-api"
version = "0.1.0"
description = "WeChat mini-program API for Juya English."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alibabacloud-credentials>=1.0,<2",
  "alibabacloud-oss-v2>=1.4,<2",
  "asyncmy>=0.2.10,<1",
  "celery>=5.4,<6",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "redis>=5.2,<8",
  "sqlalchemy[asyncio]>=2.0.37,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/juya_miniapp_api"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["juya_miniapp_api"]

[tool.coverage.run]
branch = true
source = ["juya_miniapp_api"]
